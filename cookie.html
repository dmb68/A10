<!DOCTYPE html>
<html>
    <head></head>
    <body>
        <h1>Cookie Displayer</h1>
        <p id="display"></p>

        <script>
            // display cookie
            if(document.cookie == ""){
                document.getElementById("display").innerHTML = "Cookie not found.";
            }
            else {
                document.getElementById("display").innerHTML = "document.cookie: " + document.cookie;
            }

            // set cookie
            document.cookie = "username=Jared; max-age=86400; path=/";
        </script>
    <footer>&copy; Dillon Benik, 11/17/2026</footer>
    </body>
</html>
