<!DOCTYPE html>
<html>
    <head></head>
    <body>
        <h1>Cookie Displayer</h1>
        <p id="display"></p>

        <script>
            // set and display cookie
            if(document.cookie == "") {
                var val = prompt("Enter a value for the cookie");

                document.cookie = "username=" + val + "; max-age=86400; path=/";
                document.getElementById("display").innerHTML = "Cookie value saved.";
            }
            else {
                document.getElementById("display").innerHTML = "document.cookie: " + document.cookie;
            }

        </script>
    <footer>&copy; Dillon Benik, 11/17/2026</footer>
    </body>
</html>
